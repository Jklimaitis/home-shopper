name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Guard -- no personal data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No personal data may be committed
        run: python scripts/guard_dados_sensiveis.py

  schema:
    name: Schema and domain tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: home_shopper
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: home_shopper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply schema
        env:
          PGPASSWORD: ci
        run: |
          set -euo pipefail
          for f in db/*.sql; do
            echo "::group::$f"
            psql -h localhost -U home_shopper -d home_shopper -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Domain tests
        env:
          PGPASSWORD: ci
        # Two things matter here:
        #  * no -q: it suppresses \echo and NOTICE, and the assertion count
        #    below would drop from 21 to 9 on a perfectly good schema.
        #  * 2>&1: psql sends NOTICE and error text to STDERR, so a plain
        #    "psql ... | tee" captures the \echo lines but silently drops
        #    every RESULT: PASS. The check below then counts 0 and fails a
        #    correct schema.
        run: |
          psql -h localhost -U home_shopper -d home_shopper \
               -v ON_ERROR_STOP=1 -f tests/smoke_test.sql 2>&1 | tee /tmp/smoke.log

      - name: Fail on any failing assertion
        env:
          PGPASSWORD: ci
        run: |
          status=0
          if grep -qE "^psql:.*ERROR" /tmp/smoke.log; then
            echo "::error::SQL error during the tests"
            grep -nE "^psql:.*ERROR" /tmp/smoke.log
            status=1
          fi
          if grep -qE "\|[[:space:]]*FAIL" /tmp/smoke.log; then
            echo "::error::a test assertion reported FAIL"
            grep -nE "\|[[:space:]]*FAIL" /tmp/smoke.log
            status=1
          fi
          # 5 DO blocks report "RESULT: PASS" (A2, A5, A6, R1..R5 are
          # NOTICE-based). The table assertions A1/A3/A4/A8/A9/A10 print
          # PASS as a column, checked separately above.
          blocks=$(grep -c "RESULT: PASS" /tmp/smoke.log || true)
          passed=$(grep -c "PASS" /tmp/smoke.log || true)
          echo "assertion blocks: $blocks, PASS mentions: $passed"
          if [ "$blocks" -lt 5 ]; then
            echo "::error::expected 5 assertion blocks to report PASS, got $blocks"
            status=1
          fi
          if [ "$passed" -lt 20 ]; then
            echo "::error::expected at least 20 PASS results, got $passed"
            status=1
          fi
          exit $status

      - name: Every constraint is named
        env:
          PGPASSWORD: ci
        run: |
          unnamed=$(psql -h localhost -U home_shopper -d home_shopper -tAc "
            SELECT coalesce(string_agg(conname, ', '), '')
              FROM pg_constraint c
              JOIN pg_namespace n ON n.oid = c.connamespace
             WHERE n.nspname = 'public'
               AND c.conname !~ '^(pk|uk|ck|fk)_';")
          if [ -n "$unnamed" ]; then
            echo "::error::unnamed constraints: $unnamed"
            exit 1
          fi
          echo "all constraints follow the pk_/uk_/ck_/fk_ convention"

      - name: Structure created
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U home_shopper -d home_shopper -tAc "
            SELECT 'tables:  ' || count(*) FROM information_schema.tables
             WHERE table_schema='public' AND table_type='BASE TABLE';
            SELECT 'views:   ' || count(*) FROM information_schema.views
             WHERE table_schema='public';
            SELECT 'indexes: ' || count(*) FROM pg_indexes WHERE schemaname='public';
            SELECT 'triggers:' || count(*) FROM information_schema.triggers
             WHERE trigger_schema='public';"
