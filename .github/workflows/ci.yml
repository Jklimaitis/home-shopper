name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  guard:
    name: Guard de dados sensiveis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nenhum dado pessoal pode ser versionado
        run: python scripts/guard_dados_sensiveis.py

  schema:
    name: Schema e testes de dominio
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: home_shopper
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: home_shopper
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGPASSWORD: ci

    steps:
      - uses: actions/checkout@v4

      - name: Instalar cliente psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Criar schema
        env:
          PGPASSWORD: ci
        run: |
          for f in db/001_schema.sql db/002_triggers_views.sql db/003_indexes_views.sql; do
            echo "::group::$f"
            psql -h localhost -U home_shopper -d home_shopper -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

      - name: Smoke test
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U home_shopper -d home_shopper \
               -v ON_ERROR_STOP=1 -f tests/smoke_test.sql | tee /tmp/smoke.log

      - name: Falhar se algum teste falhar
        env:
          PGPASSWORD: ci
        run: |
          if grep -qE "FAIL" /tmp/smoke.log; then
            echo "::error::houve assercao FAIL"
            grep -nE "FAIL" /tmp/smoke.log
            exit 1
          fi
          if grep -qE "ERROR" /tmp/smoke.log; then
            echo "::error::houve ERROR no smoke test"
            grep -nE "ERROR" /tmp/smoke.log
            exit 1
          fi
          echo "todos os testes passaram"

      - name: Estrutura criada
        env:
          PGPASSWORD: ci
        run: |
          psql -h localhost -U home_shopper -d home_shopper -tAc "
            select 'tabelas: ' || count(*) from information_schema.tables
             where table_schema='public' and table_type='BASE TABLE';
            select 'views: '   || count(*) from information_schema.views
             where table_schema='public';
            select 'triggers: '|| count(*) from information_schema.triggers
             where trigger_schema='public';"
